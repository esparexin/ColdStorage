name: ColdStorage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ColdStorage CI
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/cold_storage_test?replicaSet=rs0&directConnection=true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6.0 mongod --replSet rs0 --bind_ip_all
          sleep 2
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          until docker exec mongodb mongosh --quiet --eval 'db.isMaster().ismaster' | grep -q true; do sleep 1; done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts shared types
        run: npm run build --workspace=@cold-storage/contracts

      - name: Repository hygiene audit
        run: npm run hygiene

      - name: Source line budget audit
        run: npm run line-budget

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build packages
        run: npm run build
