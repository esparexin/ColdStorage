name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      release_notes:
        description: 'Release summary notes'
        required: false
        default: 'Production release'
      deploy_production:
        description: 'Deploy Production (requires manual approval gate)'
        required: false
        type: boolean
        default: false
      deploy_mobile:
        description: 'Mobile Production Release (requires manual approval gate)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate-and-package:
    name: Build & Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce hygiene audit
        run: npm run hygiene

      - name: Enforce line budget
        run: npm run line-budget

      - name: Enforce type-check
        run: npm run type-check

      - name: Build production bundle
        run: npm run build

      - name: Package release artifact
        run: |
          mkdir -p release-bundle
          tar -czf release-bundle/coldstorage-release.tar.gz package.json packages/*/dist packages/frontend/.next 2>/dev/null || tar -czf release-bundle/coldstorage-release.tar.gz package.json packages/*/dist 2>/dev/null || tar -czf release-bundle/coldstorage-release.tar.gz package.json

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coldstorage-release
          path: release-bundle/
          retention-days: 30

  deploy-production:
    name: Deploy Production
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: production
    if: ${{ inputs.deploy_production == true }}
    steps:
      - name: Deploy to production environment
        run: echo "Production deployment gated and approved."

  # TBD: web-only product (see PRODUCT.md Platform); mobile job is a placeholder and
  # must not be taken as a working mobile release pipeline.
  mobile-production-release:
    name: Mobile Production Release (TBD placeholder)
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: mobile-production
    if: ${{ inputs.deploy_mobile == true }}
    steps:
      - name: Mobile release
        run: echo "Mobile production release gated and approved."
